<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Room 13 — Records</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}"/>
</head>
<body>
  <nav class="nav">
    <span class="brand">Room 13</span>
    <span>Signed in as <b style="color:var(--ink)" th:text="${player.username}">agent</b> · <a th:href="@{/menu}">Menu</a> · <a th:href="@{/logout}">Sign out</a></span>
  </nav>

  <main class="dashboard-wrap">
    <h1 class="dash-title">Your records</h1>

    <div class="player-card">
      <div class="pc-label">Operative</div>
      <div class="pc-name" th:text="${player.username}">USERNAME</div>
      <div class="pc-label">Best escape score</div>
      <div class="pc-score" th:text="${player.bestScore}">0</div>
    </div>

    <div class="section-h">
      <h2>Saved sessions</h2>
    </div>

    <div th:if="${savedGames == null or #lists.isEmpty(savedGames)}" class="empty-msg">
      No saved sessions found.
    </div>

    <table th:if="${savedGames != null and !#lists.isEmpty(savedGames)}">
      <thead>
        <tr><th>#</th><th>Level</th><th>Riddle</th><th>Time left</th><th>Saved at</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="sg, stat : ${savedGames}">
          <td th:text="${stat.index + 1}">1</td>
          <td><b th:text="${sg.level}">EASY</b></td>
          <td th:text="${sg.riddleIndex + 1}">1</td>
          <td th:text="${sg.remainingSeconds + 's'}">300s</td>
          <td th:text="${sg.savedAt}">2024-01-01</td>
          <td style="text-align:right">
            <a th:href="@{/game/load/{id}(id=${sg.id})}" class="resume">Resume →</a>
            <form th:action="@{/game/delete/{id}(id=${sg.id})}" method="post" style="display:inline;margin-left:12px">
              <button type="submit" class="btn-small btn-danger" onclick="return confirm('Delete?')">Delete</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>

    <div style="margin-top:48px">
      <a th:href="@{/menu}" class="r13-btn primary">← Back to menu</a>
    </div>
  </main>
</body>
</html>
