<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Room 13 — Login</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}"/>
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">
        <div class="brand">
            <span class="brand-number">13</span>
            <span class="brand-label">ROOM 13</span>
        </div>
        <p class="auth-tagline">Access Terminal</p>

        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
        <div class="alert alert-error"   th:if="${error}"   th:text="${error}"></div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label for="username">IDENTIFIER</label>
                <input type="text" id="username" name="username"
                       placeholder="enter username" autocomplete="username" required/>
            </div>
            <div class="form-group">
                <label for="password">PASSPHRASE</label>
                <input type="password" id="password" name="password"
                       placeholder="enter password" autocomplete="current-password" required/>
            </div>
            <button type="submit" class="btn btn-primary btn-full">[ AUTHENTICATE ]</button>
        </form>

        <p class="auth-link">No account? <a th:href="@{/register}">Register here</a></p>
    </div>
</div>

</body>
</html>
