<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Room 13 — Time</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111110; --paper: #161614;
    --ink: #e8e6df; --ink-2: #a8a59c; --ink-3: #6a6760;
    --rule: #2c2b27;
    --accent: #c8a96a; --warn: #b85a4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--warn); color: var(--bg); }
  a { color: inherit; }
  *:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

  .nav {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 22px 48px;
    border-bottom: 1px solid var(--rule);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px; color: var(--ink-3); letter-spacing: 0.06em;
  }
  .nav .brand { color: var(--ink); letter-spacing: 0.18em; text-transform: uppercase; font-size: 11px; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 80px 48px; }

  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.16em; color: var(--warn);
    text-transform: uppercase; margin: 0 0 18px;
  }
  h1 {
    font-weight: 400;
    font-size: clamp(48px, 7vw, 80px);
    line-height: 1.02; letter-spacing: -0.01em;
    margin: 0 0 24px; max-width: 16ch;
  }
  h1 em { font-style: italic; color: var(--warn); }
  .lede {
    font-style: italic;
    color: var(--ink-2); font-size: 19px; line-height: 1.55;
    max-width: 50ch; margin: 0 0 56px;
  }

  .stats { border-top: 1px solid var(--rule); }
  .r13-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 18px 0;
    border-bottom: 1px solid var(--rule);
  }
  .r13-row .k {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.1em; color: var(--ink-3);
    text-transform: uppercase;
  }
  .r13-row .v { font-size: 18px; font-variant-numeric: tabular-nums; }
  .r13-row.total { padding: 28px 0; }
  .r13-row.total .v { font-size: 36px; color: var(--warn); }

  .actions {
    margin-top: 56px;
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  .r13-btn {
    padding: 14px 22px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px; letter-spacing: 0.04em;
    text-decoration: none;
    border: 1px solid var(--rule); color: var(--ink);
  }
  .r13-btn:hover { border-color: var(--accent); color: var(--accent); }
  .r13-btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .r13-btn.primary:hover { background: var(--warn); border-color: var(--warn); color: var(--bg); }
</style>
</head>
<body>
  <nav class="nav">
    <span class="brand">Room 13</span>
    <span><a href="menu.html" style="text-decoration:none; color:var(--ink-2);">Back to menu</a></span>
  </nav>

  <main class="wrap">
    <p class="eyebrow">The clock ran out</p>
    <h1>The door <em>stayed</em> shut.</h1>
    <p class="lede">Time elapsed. The corridor lights cut to standby and the room kept its secret. You can try again — the document is still on the desk.</p>

    <div class="stats">
      <div class="r13-r13-row"><span class="k">Level</span><span class="v">Operative</span></div>
      <div class="r13-r13-row"><span class="k">Time used</span><span class="v">04:00</span></div>
      <div class="r13-r13-row"><span class="k">Attempts used</span><span class="v">3 of 3</span></div>
      <div class="r13-r13-row total"><span class="k">Final score</span><span class="v">240</span></div>
    </div>

    <div class="actions">
      <a class="r13-r13-btn primary" href="game.html">Try again</a>
      <a class="r13-r13-btn" href="menu.html">Back to menu</a>
    </div>
  </main>
</body>
</html>
