<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Room 13 — Enter the code</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111110; --paper: #161614;
    --ink: #e8e6df; --ink-2: #a8a59c; --ink-3: #6a6760;
    --rule: #2c2b27;
    --accent: #c8a96a; --warn: #b85a4a; --good: #8fa37a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    min-height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--bg); }
  button { font: inherit; cursor: pointer; color: inherit; }
  *:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
  *:focus:not(:focus-visible) { outline: none; }

  .behind {
    position: fixed; inset: 0;
    display: grid; grid-template-columns: 240px 1fr 280px;
    filter: blur(4px) saturate(0.6); opacity: 0.35;
    pointer-events: none;
  }
  .behind > div { border-right: 1px solid var(--rule); padding: 32px; }
  .behind .ln { height: 8px; background: #1a1a18; margin-bottom: 14px; }
  .behind .ln.s { width: 60%; }
  .behind .blk { background: var(--paper); border: 1px solid var(--rule); height: 60%; margin-top: 18px; }

  .veil {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(17,17,16,0.85), rgba(0,0,0,0.96));
  }

  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    z-index: 5;
  }
  .modal {
    width: 100%; max-width: 480px;
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 36px 40px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.6);
  }
  .head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px;
  }
  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.1em; color: var(--ink-3);
    text-transform: uppercase;
  }
  .close {
    background: transparent; border: 1px solid var(--rule);
    color: var(--ink-3); width: 28px; height: 28px;
    text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .close:hover { color: var(--warn); border-color: var(--warn); }
  h2 { font-weight: 400; font-size: 26px; line-height: 1.15; margin: 0 0 6px; }
  h2 em { font-style: italic; color: var(--accent); }
  .helper { color: var(--ink-2); font-size: 14px; margin: 0 0 24px; }
  .helper b { color: var(--warn); font-weight: 600; }

  .pins { display: flex; gap: 10px; justify-content: center; margin: 6px 0 16px; }
  .pins.shake { animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }
  .pb {
    width: 56px; height: 64px;
    border: 1px solid var(--rule); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 24px; font-weight: 500; color: var(--ink);
    transition: border-color 0.15s ease;
  }
  .pb.empty { color: var(--ink-3); }
  .pb.active { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .pb.error { border-color: var(--warn); color: var(--warn); }
  .pb.pop { animation: pop 0.18s ease; }
  @keyframes pop { 0% { transform: scale(0.9); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

  .msg { text-align: center; min-height: 18px; font-size: 13px; }
  .msg.err { color: var(--warn); }
  .msg.ok { color: var(--good); }

  .keypad {
    display: grid; grid-template-columns: repeat(3, 56px);
    gap: 8px; justify-content: center;
    margin-top: 18px;
  }
  .key {
    width: 56px; height: 56px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--rule);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 18px; font-weight: 500;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .key:hover { border-color: var(--accent); }
  .key.clr { color: var(--ink-2); font-size: 12px; letter-spacing: 0.1em; }
  .key.ok  { color: var(--accent); }
  .key.ok:hover { background: var(--accent); color: var(--bg); }

  .foot {
    margin-top: 22px;
    display: flex; justify-content: space-between;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em;
  }
  .foot a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--rule); padding-bottom: 1px; }
  .foot a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  .tweaks {
    position: fixed; bottom: 16px; left: 16px;
    display: flex; gap: 6px; align-items: center;
    background: var(--paper); border: 1px solid var(--rule);
    padding: 6px 8px; z-index: 20;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px;
  }
  .tweaks .lbl { color: var(--ink-3); padding: 0 6px; }
  .tweaks button {
    background: transparent; color: var(--ink-2);
    border: 1px solid var(--rule); padding: 4px 10px;
  }
  .tweaks button.on { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
  <div class="behind" aria-hidden="true">
    <div><div class="ln"></div><div class="ln s"></div><div class="ln"></div><div class="ln s"></div></div>
    <div><div class="blk"></div></div>
    <div><div class="ln s"></div><div class="ln"></div><div class="ln s"></div></div>
  </div>
  <div class="veil"></div>

  <div class="stage">
    <form class="modal" id="pinForm" action="/game/submit-pin" method="post" autocomplete="off">
      <div class="head">
        <span class="eyebrow">Lockplate · Wing C</span>
        <a href="game.html" class="close" aria-label="close">×</a>
      </div>
      <h2>Enter the <em>code</em>.</h2>
      <p class="helper">You have <b id="attemptsLeft">2</b> attempts remaining.</p>

      <div class="pins" id="pinRow"></div>
      <div class="msg" id="msg" aria-live="polite">&nbsp;</div>

      <div class="keypad" id="keypad">
        <button type="button" class="key" data-k="1">1</button>
        <button type="button" class="key" data-k="2">2</button>
        <button type="button" class="key" data-k="3">3</button>
        <button type="button" class="key" data-k="4">4</button>
        <button type="button" class="key" data-k="5">5</button>
        <button type="button" class="key" data-k="6">6</button>
        <button type="button" class="key" data-k="7">7</button>
        <button type="button" class="key" data-k="8">8</button>
        <button type="button" class="key" data-k="9">9</button>
        <button type="button" class="key clr" data-k="CLR">CLR</button>
        <button type="button" class="key" data-k="0">0</button>
        <button type="button" class="key ok" data-k="OK">OK</button>
      </div>

      <div class="foot">
        <span>0–9 · Backspace · Enter</span>
        <a href="game.html">← Back to riddle</a>
      </div>
    </form>
  </div>

  <div class="tweaks">
    <span class="lbl">Length</span>
    <button data-l="3">3</button>
    <button data-l="4" class="on">4</button>
    <button data-l="6">6</button>
    <span class="lbl">·</span>
    <button id="forceErr">Force err</button>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const lvlLen = { EASY: 3, MEDIUM: 4, HARD: 6 };
  let LEN = lvlLen[params.get('level')] || 4;
  function correctFor(len) { return len === 3 ? '724' : len === 6 ? '724391' : '7239'; }
  let CORRECT = correctFor(LEN);
  let buf = [];
  const row = document.getElementById('pinRow');

  function render() {
    CORRECT = correctFor(LEN);
    row.innerHTML = '';
    for (let i = 0; i < LEN; i++) {
      const b = document.createElement('div');
      b.className = 'pb' + (buf[i] == null ? ' empty' : '') + (i === buf.length ? ' active' : '');
      b.textContent = buf[i] != null ? buf[i] : '·';
      row.appendChild(b);
    }
  }
  render();

  function press(k) {
    const msg = document.getElementById('msg');
    msg.textContent = '\u00a0'; msg.className = 'msg';
    if (k === 'CLR') { buf = []; row.classList.remove('shake'); render(); return; }
    if (k === 'OK') return submit();
    if (buf.length >= LEN) return;
    buf.push(k); render();
    const idx = buf.length - 1;
    const box = row.children[idx];
    if (box) { box.classList.add('pop'); setTimeout(() => box.classList.remove('pop'), 200); }
    if (buf.length === LEN) setTimeout(submit, 280);
  }
  function backspace() { if (buf.length) { buf.pop(); render(); } }
  function submit() {
    if (buf.length < LEN) { flashErr('Code is incomplete.'); return; }
    if (buf.join('') === CORRECT) {
      const m = document.getElementById('msg');
      m.textContent = 'Access granted — opening the door.'; m.className = 'msg ok';
      [...r13-row.children].forEach(b => { b.style.borderColor = 'var(--good)'; b.style.color = 'var(--good)'; });
      setTimeout(() => location.href = 'win.html', 900);
    } else {
      flashErr('That isn\'t the code.');
      let n = parseInt(document.getElementById('attemptsLeft').textContent, 10);
      n = Math.max(0, n - 1);
      document.getElementById('attemptsLeft').textContent = n;
      if (n === 0) setTimeout(() => location.href = 'game-over.html', 900);
    }
  }
  function flashErr(text) {
    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
    [...r13-row.children].forEach(b => b.classList.add('error'));
    const m = document.getElementById('msg');
    m.textContent = text; m.className = 'msg err';
    setTimeout(() => { [...r13-row.children].forEach(b => b.classList.remove('error')); buf = []; render(); }, 700);
  }

  document.getElementById('keypad').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-k]'); if (b) press(b.dataset.k);
  });
  window.addEventListener('keydown', (e) => {
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Enter') submit();
    else if (e.key === 'Escape') { buf = []; render(); }
  });
  document.querySelectorAll('.tweaks button[data-l]').forEach(b => {
    b.addEventListener('click', () => {
      LEN = parseInt(b.dataset.l, 10); buf = [];
      document.querySelectorAll('.tweaks button[data-l]').forEach(x => x.classList.toggle('on', x === b));
      render();
    });
  });
  document.getElementById('forceErr').addEventListener('click', () => {
    buf = Array.from({length: LEN}, () => '0'); render(); setTimeout(submit, 100);
  });
</script>
</body>
</html>
